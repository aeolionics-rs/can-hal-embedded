[package]
name = "curiosity-pic32ck"
description = "Bench tests of can-hal-mcan on Microchip's PIC32CK SG01 Curiosity Ultra (EV33A17A)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Bare metal: there is no test harness on the target.
[[bin]]
name = "blink"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
pic32ck-sg01-pac = { path = "pac", features = ["rt"] }
panic-halt = "1.0.0"
rtt-target = "0.6.1"

[lints]
workspace = true
