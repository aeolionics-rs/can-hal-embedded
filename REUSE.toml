version = 1

# Files that can't carry a header, or that Cargo writes.
[[annotations]]
path = [
    "**/Cargo.toml",
    "Cargo.lock",
    ".cargo/config.toml",
    ".gitignore",
    "**/*.md",
    "**/memory.x",
]
SPDX-FileCopyrightText = "2026-2026. Aeolionics, LLC"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The PAC, generated by svd2rust from Microchip's SVD (see svd/LICENSE.txt).
[[annotations]]
path = [
    "curiosity-pic32ck/pac/src/**",
    "curiosity-pic32ck/pac/build.rs",
    "curiosity-pic32ck/pac/device.x",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Microchip Technology Inc."
SPDX-License-Identifier = "Apache-2.0"
