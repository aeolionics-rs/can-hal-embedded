[package]
name = "can-hal-fdcan"
description = "can-hal backend for ST's FDCAN, the cut-down Bosch M_CAN of the STM32G0, G4, L5, U5 and H5"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["can", "can-fd", "fdcan", "stm32"]
categories = ["embedded", "hardware-support", "no-std"]
publish = false

[features]
defmt = ["dep:defmt"]

[dependencies]
# Our fork's `aeolionics` branch, for the confirmed-transmission traits.
can-hal = { version = "0.4.3", path = "../../can-hal-rs/can-hal", package = "can-hal-rs", default-features = false }
critical-section = "1.2.0"
defmt = { version = "1.2.0", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true
