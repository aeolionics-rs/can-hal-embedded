[package]
name = "disco-f072b"
description = "Bench tests of can-hal-bxcan on ST's 32F072BDISCOVERY"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Bare metal: there is no test harness on the target.
[[bin]]
name = "loopback"
test = false
bench = false

[dependencies]
can-hal = { version = "0.4.3", git = "https://github.com/aeolionics-rs/can-hal-rs", branch = "aeolionics", package = "can-hal-rs", default-features = false }
can-hal-bxcan = { path = "../can-hal-bxcan", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f072rb", "defmt", "memory-x", "time-driver-tim2", "unstable-pac"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[lints]
workspace = true
