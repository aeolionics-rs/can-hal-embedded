[package]
name = "can-hal-bxcan"
description = "can-hal backend for the bxCAN controller of STM32 (and compatible) microcontrollers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["can", "bxcan", "stm32", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]
publish = false

[features]
defmt = ["dep:defmt", "can-common/defmt"]

[dependencies]
# What CAN drivers share: transmit ordering, the event queue, the bit-timing
# solver, Clock.
can-common = { version = "0.1.0", git = "https://github.com/aeolionics-rs/can-common" }
# Our fork's `aeolionics` branch, for the confirmed-transmission traits.
can-hal = { version = "0.4.3", git = "https://github.com/aeolionics-rs/can-hal-rs", branch = "aeolionics", package = "can-hal-rs", default-features = false }
critical-section = "1.2.0"
defmt = { version = "1.2.0", optional = true }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

[lints]
workspace = true
